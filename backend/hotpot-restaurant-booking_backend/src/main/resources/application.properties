# Chế độ in hiện tại:
# - OFFICE_PRINTER : In ra máy in văn phòng / Microsoft Print to PDF (đang dùng)
# - ESC_POS        : In trực tiếp ra máy in nhiệt K80 LAN/WiFi (khi mua máy nhiệt)
# - VIRTUAL        : Bắn WebSocket ra màn hình Vue KDS giả lập
printer.mode=VIRTUAL

# --- Cấu hình cho Máy in văn phòng (OFFICE_PRINTER) ---
# Tên máy in cài trên Windows (ví dụ: Canon, HP, PDF, Xprinter)
# Nếu để trống, hệ thống sẽ dùng Máy in Mặc định (Default Printer) của Windows
printer.office.bep-printer-name=Canon LBP2900
printer.office.bar-printer-name=

# --- Cấu hình IP cho Máy in nhiệt K80 (ESC_POS) ---
printer.escpos.bep-ip=192.168.1.200
printer.escpos.bar-ip=192.168.1.201
printer.escpos.port=9100