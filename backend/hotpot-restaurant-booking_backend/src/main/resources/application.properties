# Thông tin ứng dụng
spring.application.name=hotpot-restaurant-booking_backend

# Cấu hình Database SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=hotpot_restaurant_booking;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123



# Cấu hình Hibernate & JPA
# Không cho phép Hibernate tự tạo bảng để ưu tiên dùng script schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false

# Cấu hình khởi tạo dữ liệu bằng file .sql (schema.sql, data.sql)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Hiển thị SQL (tắt nếu không cần thiết để tránh tràn log)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Custom naming strategy: giữ nguyên tên bảng PascalCase, ánh xạ cột camelCase sang snake_case
spring.jpa.hibernate.naming.physical-strategy=com.example.hotpotrestaurantbooking_backend.config.DatabaseNamingStrategy

# CẤU HÌNH LOGGING (Quan trọng: Đã điều chỉnh để không tràn log)
# Đặt về INFO để tránh bị tràn bởi các log mức TRACE/DEBUG
logging.level.org.hibernate.type=info
logging.level.org.springframework=info
logging.level.org.hibernate.orm.jdbc.bind=warn

# Nếu bạn dùng datasource-proxy thì mới để dòng này, nếu không thì comment lại
# logging.level.net.ttddyy.dsproxy.listener=debug