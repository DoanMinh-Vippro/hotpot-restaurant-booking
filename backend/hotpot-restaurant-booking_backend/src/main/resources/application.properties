spring.application.name=hotpot-restaurant-booking_backend

# Cấu hình Database SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=hotpot_restaurant_booking55;trustServerCertificate=true;sendStringParametersAsUnicode=true;
spring.datasource.username=sa
